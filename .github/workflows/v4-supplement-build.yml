name: Build v4 supplement

on:
  push:
    branches: [v4-supplement]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-supplement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build generated site
        run: |
          cd src
          python3 build.py
          python3 build_print.py
      - name: Validate
        run: |
          cd src
          python3 check_html.py
          python3 check_links.py
          python3 tools/svg_audit.py
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html glossary.html print_zh.html print_en.html lessons/
          if git diff --cached --quiet; then
            echo "Generated output already in sync."
          else
            git commit -m "build(v4): regenerate site for Part 12"
            git push origin HEAD:v4-supplement
          fi
